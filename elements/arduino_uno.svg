<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="540" height="380">
  <!-- Płytka PCB z realistycznym odcieniem i otworami montażowymi -->
  <rect x="20" y="20" width="500" height="340" rx="15" fill="#007175" stroke="#005A5D" stroke-width="2"/>
  <circle cx="40" cy="40" r="8" fill="#0D1117"/><circle cx="40" cy="40" r="5" fill="#C0C0C0"/>
  <circle cx="40" cy="340" r="8" fill="#0D1117"/><circle cx="40" cy="340" r="5" fill="#C0C0C0"/>
  <circle cx="500" cy="40" r="8" fill="#0D1117"/><circle cx="500" cy="40" r="5" fill="#C0C0C0"/>
  <circle cx="500" cy="340" r="8" fill="#0D1117"/><circle cx="500" cy="340" r="5" fill="#C0C0C0"/>

  <!-- Złącze USB -->
  <rect x="10" y="40" width="45" height="40" rx="3" fill="#D3D3D3" stroke="#888888"/>
  <rect x="15" y="45" width="30" height="30" fill="#EEEEEE"/>

  <!-- Złącze zasilania DC -->
  <rect x="10" y="270" width="40" height="50" rx="3" fill="#1A1A1A" stroke="#000000"/>
  <rect x="50" y="285" width="10" height="20" fill="#A9A9A9"/>

  <!-- Chip ATmega16U2 (Obsługa USB) -->
  <rect x="80" y="65" width="20" height="20" rx="2" fill="#222222" transform="rotate(45 90 75)"/>

  <!-- Przycisk Reset -->
  <rect x="60" y="20" width="20" height="15" rx="1" fill="#DDDDDD" stroke="#999999"/>
  <circle cx="70" cy="27.5" r="4" fill="#AA0000"/>

  <!-- Rezonator kwarcowy -->
  <rect x="150" y="150" width="25" height="10" rx="4" fill="#B0C4DE" stroke="#888888"/>

  <!-- Złącza ICSP -->
  <rect x="115" y="40" width="15" height="25" fill="#222222"/>
  <rect x="460" y="160" width="15" height="25" fill="#222222"/>

  <!-- Główny mikrokontroler (ATmega328P DIP-28) -->
  <rect x="230" y="160" width="160" height="45" rx="3" fill="#222222" stroke="#111111"/>
  <path d="M 230 175 a 10 10 0 0 1 0 15" fill="#111111"/>
  <circle cx="245" cy="170" r="3" fill="#444444"/>

  <!-- Złącza / Listwy pinów -->
  <rect x="180" y="25" width="145" height="15" fill="#111111"/>
  <rect x="335" y="25" width="145" height="15" fill="#111111"/>
  <rect x="140" y="340" width="115" height="15" fill="#111111"/>
  <rect x="265" y="340" width="85" height="15" fill="#111111"/>

  <!-- Piny i opisy wyrównane z układem -->
  <g fill="#FFD700">
    <!-- Cyfrowe lewa (SCL do 8) -->
    <circle cx="187.5" cy="32.5" r="4"/><text x="187.5" y="55" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(90 187.5 55)">SCL</text>
    <circle cx="202.5" cy="32.5" r="4"/><text x="202.5" y="55" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(90 202.5 55)">SDA</text>
    <circle cx="217.5" cy="32.5" r="4"/><text x="217.5" y="55" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(90 217.5 55)">AREF</text>
    <circle cx="232.5" cy="32.5" r="4"/><text x="232.5" y="55" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(90 232.5 55)">GND</text>
    <circle cx="247.5" cy="32.5" r="4"/><text x="247.5" y="55" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(90 247.5 55)">13</text>
    <circle cx="262.5" cy="32.5" r="4"/><text x="262.5" y="55" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(90 262.5 55)">12</text>
    <circle cx="277.5" cy="32.5" r="4"/><text x="277.5" y="55" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(90 277.5 55)">~11</text>
    <circle cx="292.5" cy="32.5" r="4"/><text x="292.5" y="55" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(90 292.5 55)">~10</text>
    <circle cx="307.5" cy="32.5" r="4"/><text x="307.5" y="55" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(90 307.5 55)">~9</text>
    <circle cx="322.5" cy="32.5" r="4"/><text x="322.5" y="55" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(90 322.5 55)">8</text>

    <!-- Cyfrowe prawa (7 do RX) -->
    <circle cx="342.5" cy="32.5" r="4"/><text x="342.5" y="55" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(90 342.5 55)">7</text>
    <circle cx="357.5" cy="32.5" r="4"/><text x="357.5" y="55" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(90 357.5 55)">~6</text>
    <circle cx="372.5" cy="32.5" r="4"/><text x="372.5" y="55" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(90 372.5 55)">~5</text>
    <circle cx="387.5" cy="32.5" r="4"/><text x="387.5" y="55" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(90 387.5 55)">4</text>
    <circle cx="402.5" cy="32.5" r="4"/><text x="402.5" y="55" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(90 402.5 55)">~3</text>
    <circle cx="417.5" cy="32.5" r="4"/><text x="417.5" y="55" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(90 417.5 55)">2</text>
    <circle cx="432.5" cy="32.5" r="4"/><text x="432.5" y="55" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(90 432.5 55)">TX>1</text>
    <circle cx="447.5" cy="32.5" r="4"/><text x="447.5" y="55" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(90 447.5 55)">RX&lt;0</text>

    <!-- Zasilanie (NC do VIN) -->
    <circle cx="147.5" cy="347.5" r="4"/><text x="147.5" y="325" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(-90 147.5 325)">NC</text>
    <circle cx="162.5" cy="347.5" r="4"/><text x="162.5" y="325" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(-90 162.5 325)">IOREF</text>
    <circle cx="177.5" cy="347.5" r="4"/><text x="177.5" y="325" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(-90 177.5 325)">RST</text>
    <circle cx="192.5" cy="347.5" r="4"/><text x="192.5" y="325" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(-90 192.5 325)">3V3</text>
    <circle cx="207.5" cy="347.5" r="4"/><text x="207.5" y="325" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(-90 207.5 325)">5V</text>
    <circle cx="222.5" cy="347.5" r="4"/><text x="222.5" y="325" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(-90 222.5 325)">GND</text>
    <circle cx="237.5" cy="347.5" r="4"/><text x="237.5" y="325" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(-90 237.5 325)">GND</text>
    <circle cx="252.5" cy="347.5" r="4"/><text x="252.5" y="325" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(-90 252.5 325)">VIN</text>

    <!-- Analogowe (A0 do A5) -->
    <circle cx="272.5" cy="347.5" r="4"/><text x="272.5" y="325" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(-90 272.5 325)">A0</text>
    <circle cx="287.5" cy="347.5" r="4"/><text x="287.5" y="325" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(-90 287.5 325)">A1</text>
    <circle cx="302.5" cy="347.5" r="4"/><text x="302.5" y="325" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(-90 302.5 325)">A2</text>
    <circle cx="317.5" cy="347.5" r="4"/><text x="317.5" y="325" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(-90 317.5 325)">A3</text>
    <circle cx="332.5" cy="347.5" r="4"/><text x="332.5" y="325" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(-90 332.5 325)">A4</text>
    <circle cx="347.5" cy="347.5" r="4"/><text x="347.5" y="325" font-family="monospace" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle" transform="rotate(-90 347.5 325)">A5</text>
  </g>

  <!-- Diody LED (L, TX, RX, ON) -->
  <g>
    <rect x="235" y="100" width="8" height="12" fill="#EAEAEA" rx="2"/><circle cx="239" cy="106" r="3" fill="#FFCC00"/>
    <text x="239" y="95" font-family="sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle">L</text>
    <rect x="360" y="100" width="8" height="12" fill="#EAEAEA" rx="2"/><circle cx="364" cy="106" r="3" fill="#FFCC00"/>
    <text x="364" y="95" font-family="sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle">TX</text>
    <rect x="360" y="120" width="8" height="12" fill="#EAEAEA" rx="2"/><circle cx="364" cy="126" r="3" fill="#FFCC00"/>
    <text x="364" y="115" font-family="sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle">RX</text>
    <rect x="420" y="270" width="8" height="12" fill="#EAEAEA" rx="2"/><circle cx="424" cy="276" r="3" fill="#00FF00"/>
    <text x="424" y="265" font-family="sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle">ON</text>
  </g>

  <!-- Logo i branding -->
  <text x="360" y="260" font-family="sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="1">UNO</text>
  <text x="250" y="235" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">ARDUINO</text>
  <g stroke="#FFFFFF" stroke-width="3" fill="none">
    <circle cx="350" cy="225" r="12"/><circle cx="376" cy="225" r="12"/>
    <path d="M 345 225 L 355 225 M 371 225 L 381 225 M 376 220 L 376 230" stroke-width="2"/>
  </g>
</svg>
