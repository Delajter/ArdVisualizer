<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 560" width="280" height="560">
  <!-- Obudowa / Płytka PCB (Czarna) -->
  <rect x="20" y="20" width="240" height="520" rx="12" fill="#1A1A1A" stroke="#333333" stroke-width="3"/>

  <!-- Port Micro-USB -->
  <rect x="95" y="2" width="90" height="40" rx="4" fill="#B3B3B3" stroke="#808080" stroke-width="1.5"/>
  <rect x="105" y="2" width="70" height="8" fill="#707070"/>

  <!-- Antena PCB na samej górze (złote/żółte ścieżki) -->
  <g stroke="#FFD700" stroke-width="3" fill="none" opacity="0.9">
    <path d="M 60 45 L 220 45"/>
    <path d="M 60 45 L 60 55 L 75 55 L 75 48 L 90 48 L 90 55 L 105 55 L 105 48 L 120 48 L 120 55 L 135 55 L 135 48 L 150 48 L 150 55 L 165 55 L 165 48 L 180 48 L 180 55 L 195 55 L 195 48 L 220 48 M 220 45 L 220 55"/>
  </g>

  <!-- Moduł ESP-WROOM-32 (metalowy ekran) -->
  <rect x="55" y="75" width="170" height="150" rx="5" fill="#C0C0C0" stroke="#A9A9A9" stroke-width="2"/>
  <rect x="65" y="105" width="150" height="110" rx="2" fill="#B0B0B0" stroke="#8E8E8E" stroke-width="1"/>
  <!-- Logo i napisy na metalowym ekranie -->
  <text x="140" y="145" font-family="sans-serif" font-size="16" font-weight="900" fill="#2E2E2E" text-anchor="middle">ESP32</text>
  <text x="140" y="165" font-family="sans-serif" font-size="10" font-weight="bold" fill="#3D3D3D" text-anchor="middle" letter-spacing="0.5">ESP-WROOM-32</text>
  <text x="140" y="180" font-family="sans-serif" font-size="7" fill="#4A4A4A" text-anchor="middle">FCC ID: 2AC7Z-ESPWROOM32</text>

  <!-- Przycisk EN (Reset) i Boot -->
  <!-- Lewy (EN) -->
  <rect x="40" y="475" width="30" height="30" rx="2" fill="#555555" stroke="#333333"/>
  <circle cx="55" cy="490" r="8" fill="#AA3333"/>
  <text x="55" y="520" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">EN</text>

  <!-- Prawy (BOOT / IO0) -->
  <rect x="210" y="475" width="30" height="30" rx="2" fill="#555555" stroke="#333333"/>
  <circle cx="225" cy="490" r="8" fill="#333333"/>
  <text x="225" y="520" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BOOT</text>

  <!-- Konwerter USB-UART (chip CP2102) -->
  <rect x="110" y="445" width="60" height="40" rx="3" fill="#222222" stroke="#333333" stroke-width="1"/>
  <circle cx="118" cy="453" r="1.5" fill="#555"/>
  <!-- Nóżki układu scalonego -->
  <g stroke="#D3D3D3" stroke-width="1">
    <path d="M 110 450 l -3 0 M 110 455 l -3 0 M 110 460 l -3 0 M 110 465 l -3 0 M 110 470 l -3 0 M 110 475 l -3 0 M 110 480 l -3 0"/>
    <path d="M 170 450 l 3 0 M 170 455 l 3 0 M 170 460 l 3 0 M 170 465 l 3 0 M 170 470 l 3 0 M 170 475 l 3 0 M 170 480 l 3 0"/>
  </g>

  <!-- Dioda LED (Zasilanie i Onboard) -->
  <rect x="75" y="420" width="10" height="15" fill="#CC9900" rx="1"/>
  <rect x="77" y="422" width="6" height="5" fill="#FF3333"/>
  <text x="65" y="430" font-family="sans-serif" font-size="7" fill="#888888">PWR</text>

  <rect x="195" y="420" width="10" height="15" fill="#CC9900" rx="1"/>
  <rect x="197" y="422" width="6" height="5" fill="#3333FF"/>
  <text x="215" y="430" font-family="sans-serif" font-size="7" fill="#888888">D2</text>

  <!-- Piny boczne (fizyczne otwory / luty) -->
  <g fill="#FFD700" stroke="#B8860B" stroke-width="1.5">
    <!-- Lewa strona (19 pinów) -->
    <circle cx="35" cy="50" r="5.5"/> <circle cx="35" cy="72" r="5.5"/> <circle cx="35" cy="94" r="5.5"/>
    <circle cx="35" cy="116" r="5.5"/> <circle cx="35" cy="138" r="5.5"/> <circle cx="35" cy="160" r="5.5"/>
    <circle cx="35" cy="182" r="5.5"/> <circle cx="35" cy="204" r="5.5"/> <circle cx="35" cy="226" r="5.5"/>
    <circle cx="35" cy="248" r="5.5"/> <circle cx="35" cy="270" r="5.5"/> <circle cx="35" cy="292" r="5.5"/>
    <circle cx="35" cy="314" r="5.5"/> <circle cx="35" cy="336" r="5.5"/> <circle cx="35" cy="358" r="5.5"/>
    <circle cx="35" cy="380" r="5.5"/> <circle cx="35" cy="402" r="5.5"/> <circle cx="35" cy="424" r="5.5"/>
    <circle cx="35" cy="446" r="5.5"/>

    <!-- Prawa strona (19 pinów) -->
    <circle cx="245" cy="50" r="5.5"/> <circle cx="245" cy="72" r="5.5"/> <circle cx="245" cy="94" r="5.5"/>
    <circle cx="245" cy="116" r="5.5"/> <circle cx="245" cy="138" r="5.5"/> <circle cx="245" cy="160" r="5.5"/>
    <circle cx="245" cy="182" r="5.5"/> <circle cx="245" cy="204" r="5.5"/> <circle cx="245" cy="226" r="5.5"/>
    <circle cx="245" cy="248" r="5.5"/> <circle cx="245" cy="270" r="5.5"/> <circle cx="245" cy="292" r="5.5"/>
    <circle cx="245" cy="314" r="5.5"/> <circle cx="245" cy="336" r="5.5"/> <circle cx="245" cy="358" r="5.5"/>
    <circle cx="245" cy="380" r="5.5"/> <circle cx="245" cy="402" r="5.5"/> <circle cx="245" cy="424" r="5.5"/>
    <circle cx="245" cy="446" r="5.5"/>
  </g>

  <!-- Białe opisy pinów bezpośrednio NA płytce (sitodruk) -->
  <g font-family="monospace, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="start" alignment-baseline="middle">
    <!-- Lewa strona -->
    <text x="47" y="51">3V3</text>
    <text x="47" y="73">EN</text>
    <text x="47" y="95">VP</text>
    <text x="47" y="117">VN</text>
    <text x="47" y="139">D34</text>
    <text x="47" y="161">D35</text>
    <text x="47" y="183">D32</text>
    <text x="47" y="205">D33</text>
    <text x="47" y="227">D25</text>
    <text x="47" y="249">D26</text>
    <text x="47" y="271">D27</text>
    <text x="47" y="293">D14</text>
    <text x="47" y="315">D12</text>
    <text x="47" y="337">D13</text>
    <text x="47" y="359">GND</text>
    <text x="47" y="381">D9</text>
    <text x="47" y="403">D10</text>
    <text x="47" y="425">D11</text>
    <text x="47" y="447">5V</text>
  </g>

  <g font-family="monospace, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="end" alignment-baseline="middle">
    <!-- Prawa strona -->
    <text x="233" y="51">GND</text>
    <text x="233" y="73">D23</text>
    <text x="233" y="95">D22</text>
    <text x="233" y="117">TX0</text>
    <text x="233" y="139">RX0</text>
    <text x="233" y="161">D21</text>
    <text x="233" y="183">D19</text>
    <text x="233" y="205">D18</text>
    <text x="233" y="227">D5</text>
    <text x="233" y="249">TX2</text>
    <text x="233" y="271">RX2</text>
    <text x="233" y="293">D4</text>
    <text x="233" y="315">D2</text>
    <text x="233" y="337">D15</text>
    <text x="233" y="359">D8</text>
    <text x="233" y="381">D7</text>
    <text x="233" y="403">D6</text>
    <text x="233" y="425">D29</text>
    <text x="233" y="447">CLK</text>
  </g>

  <!-- Oznaczenia i napisy dekoracyjne (sitodruk) -->
  <text x="140" y="325" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">NodeMCU-32S</text>
  <text x="140" y="342" font-family="sans-serif" font-size="8" fill="#00FF00" text-anchor="middle" font-weight="bold">WiFi + BT</text>
</svg>
